<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esports Reward App</title>
<style>
:root{--bg:#ece6fa;--card:#fff;--text:#2a1560;--muted:#7b6c9f;--acc:#6d2fe0;--gold:#f5a300;--ok:#1fa971;--in:rgba(109,47,224,.09);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160c2e;--card:#26154a;--text:#f3ecff;--muted:#b3a3d6}}
:root[data-theme="dark"]{--bg:#160c2e;--card:#26154a;--text:#f3ecff;--muted:#b3a3d6}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.logo{font-weight:800;font-size:19px}.logo span{color:var(--acc)}
.bal{background:var(--card);color:var(--gold);padding:7px 13px;border-radius:20px;font-weight:700;font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;background:var(--acc);color:#fff;width:100%}
.btn.g{background:var(--ok);color:#04281a}.btn.s{background:var(--in);color:var(--text)}.btn:disabled{opacity:.45}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
input{width:100%;padding:12px;border-radius:10px;border:2px solid transparent;background:var(--in);color:var(--text);font-size:15px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--acc)}
h3{margin:4px 0 10px;font-size:15px}.mut{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid rgba(180,140,255,.18);background:var(--card);color:var(--muted);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s}
.chip.on{background:linear-gradient(135deg,#a970ff,#6d2fe0);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(109,47,224,.45);transform:scale(1.05)}
.slider{display:flex;overflow-x:auto;gap:10px;scroll-snap-type:x mandatory;margin-bottom:12px}
.slide{flex:0 0 88%;scroll-snap-align:start;border-radius:14px;padding:18px;color:#fff;font-weight:700;min-height:84px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:linear-gradient(160deg,#241542,#120a28);border:1px solid rgba(180,140,255,.25);border-radius:16px;padding:18px 12px;font-size:14px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px rgba(50,20,110,.3)}
.cat .ci{font-size:24px;background:rgba(255,255,255,.08);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lb{display:flex;gap:12px;align-items:center;padding:11px 14px;background:var(--card);border-radius:12px;margin-bottom:8px}
.lb b:first-child{width:26px;color:var(--muted)}.lb:nth-child(-n+4) b:first-child{color:var(--gold)}.lb .n{flex:1;font-weight:600}.lb .p{color:var(--ok);font-weight:700}
.room{background:var(--in);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
nav{display:flex;background:var(--card);padding:6px 0 8px}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;padding:5px;cursor:pointer}nav button.on{color:var(--acc)}nav span{display:block;font-size:19px}
.msg{text-align:center;font-weight:600;font-size:13px;min-height:20px;margin:6px 0}.ok{color:var(--ok)}.err{color:#ff5c5c}
canvas{display:block;margin:0 auto 10px;border-radius:10px;max-width:100%}
.login{max-width:440px;margin:auto;padding:30px 20px;width:100%}
.hero{background:linear-gradient(180deg,#b06bff,#7c3fd6);border-radius:16px;padding:22px 10px;text-align:center;color:#fff;font-weight:800;font-size:26px;line-height:1.1;margin-bottom:12px}.hero b{display:block;color:#ffd54a;font-size:38px}
.tc{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 14px rgba(80,40,160,.18)}
.tb{height:104px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.tm{display:flex;justify-content:space-between;padding:12px 14px 4px;text-align:center}.tm div{flex:1;font-size:11px;color:var(--muted)}.tm b{display:block;font-size:15px;color:var(--text);margin-top:3px}
.play{margin:8px 14px 14px;width:calc(100% - 28px);background:linear-gradient(180deg,#8b4dff,#5a1fc4)}
.adbox{min-height:70px;border:1px dashed var(--muted);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:var(--in);margin-bottom:14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>

async function cloudCall(method, path, body, token){

      headers: Object.assign({"Content-Type":"application/json"}, token?{Authorization:"Bearer "+token}:{}),
      body: body ? JSON.stringify(body) : undefined });

function genReport(t){
  if(!S.reports) S.reports = {};
  if(!S.reports[t.id]){
    let seed = t.id%1000+1;
    const rnd = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
    const base = ({hoop:40,arctic:180,loop:150,colorbounce:35,bubble:170,drive:150,shooter:220,knife:22,blockmatch:650})[t.g] || 150;
    let sc = base + Math.floor(rnd()*30);
    const list = [];
    for(let i=0;i<50;i++){ list.push({name:NAMES[i], score:sc}); sc = Math.max(1, sc - Math.ceil(1+rnd()*(base/22))); }
    S.reports[t.id] = list; save();
  }
  return S.reports[t.id];
}

const LB_TOTAL = 10000000, LB_TOP_N = 100, LB_MAX = 6200, LB_MID = 5500, LB_MIN = 5;
const LB_K2 = Math.log(LB_MID/LB_MIN)/(LB_TOTAL-LB_TOP_N);
function scoreAtRank(i){
  if(i < LB_TOP_N) return Math.round(LB_MAX - i*(LB_MAX-LB_MID)/(LB_TOP_N-1));
  return Math.max(LB_MIN, Math.round(LB_MID*Math.exp(-LB_K2*(i-LB_TOP_N))));
}
function estimateRank(myScore){
  if(myScore >= LB_MAX) return 0;
  if(myScore > LB_MID) return Math.round((LB_MAX-myScore)*(LB_TOP_N-1)/(LB_MAX-LB_MID));
  if(myScore <= LB_MIN) return LB_TOTAL-1;
  return Math.min(LB_TOTAL-1, Math.max(LB_TOP_N, Math.round(LB_TOP_N + Math.log(LB_MID/myScore)/LB_K2)));
}

}

function nextLbPayoutTime(){

  if(c.lbResetMode==="days" && (c.lbResetDays||[]).length){
    for(let i=0;i<8 && !(c.lbResetDays||[]).includes(t.getDay());i++) t.setDate(t.getDate()+1);
  } else if(c.lbResetMode==="interval"){
    const iv = Math.max(1, c.lbResetIntervalDays||1);
    if(S.lastLbPayout){
      const last = new Date(S.lastLbPayout);
      let base = new Date(last.getFullYear(),last.getMonth(),last.getDate(),c.lbResetHour,0,0,0);
      base.setDate(base.getDate()+iv);

}

}

function blockCluster(r0,c0){
  const rows=G.grid.length, cols=G.grid[0].length, col=G.grid[r0][c0];
  if(col===null) return [];
  const seen = new Set(), stack=[[r0,c0]], out=[];
  while(stack.length){

    if(seen.has(key)||r<0||c<0||r>=rows||c>=cols||G.grid[r][c]!==col) continue;
    seen.add(key); out.push([r,c]);
    stack.push([r-1,c],[r+1,c],[r,c-1],[r,c+1]);
  }
  return out;
}
function blockGravity(){
  const rows=G.grid.length, cols=G.grid[0].length;
  for(let c=0;c<cols;c++){
    let write = rows-1;
    for(let r=rows-1;r>=0;r--){ if(G.grid[r][c]!==null){ G.grid[write][c]=G.grid[r][c]; if(write!==r) G.grid[r][c]=null; write--; } }

  S.wd.push(wdRec);

}
// Posts a withdrawal request to the admin-configured backend webhook (Payout API Setup).
// Payload field names are the DTO/schema the backend should expect — keep this in sync if fields change.
async function sendWdToBackend(w){
  const url = cfg().payoutWebhookUrl;
  if(!url) return;
  const payload = {
    requestId: w.id,                 // our internal withdrawal ID, e.g. "WD1001"
    userId: w.user_id,               // user's phone number (app's user identifier), e.g. "+91 9876543210"
    userName: S.name || "",
    method: w.method,                // "UPI" | "PayPal" | "Paytm" | "PhonePe" | "Binance"
    payoutAddress: w.to,             // UPI ID / PayPal email / Paytm-PhonePe number, as entered by user
    mobile: w.mobile || "",          // verified mobile with country code, e.g. "+91 9876543210"
    coins: w.coins,                  // coins deducted for this withdrawal
    requestedAmount: parseFloat(w.requested), // gross amount before TDS/fee (in base currency below)
    tdsAmount: parseFloat(w.tds),    // TDS withheld (0 for PayPal/Binance)
    netAmount: parseFloat(w.net),    // amount to actually pay out
    currency: w.method==="PayPal" ? "USD" : w.method==="Binance" ? "USDT" : "INR",
    status: w.status,                // "PENDING" at the point this is sent
    provider: (cfg().payoutProviders||[])[0] || "",   // first selected provider; providersAll has the full list
    providersAll: cfg().payoutProviders || [],
    merchantId: cfg().payoutMerchantId || "",
    createdAt: w.created             // epoch ms
  };
  try{
    const res = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
    w.backendSent = res.ok; w.backendStatus = res.status; w.backendError = "";
  }catch(e){
    w.backendSent = false; w.backendStatus = 0; w.backendError = (e && e.message) ? e.message : "network error";
  }
  save();
  if(adminOn && tab==="me") me();
}

function toggleAds(){ S.adConfig.on = !S.adConfig.on; save(); me(); }
function syncActiveAdIds(){
  const nets = S.adConfig.networks || {}, mode = S.adConfig.network || "mediation";
  let net, used;
  if(mode==="mediation"){
    // Auto Fallback: AdMob -> Unity -> AppLovin (pehla network jiska banner ID bhara ho use karo)
    if(nets.admob && nets.admob.bannerId){ net = nets.admob; used = "admob"; }
    else if(nets.unity && nets.unity.bannerId){ net = nets.unity; used = "unity"; }
    else if(nets.applovin && nets.applovin.bannerId){ net = nets.applovin; used = "applovin"; }
    else { net = nets.admob||{}; used = "admob"; }
  } else {
    net = nets[mode] || {}; used = mode;
  }
  S.adConfig.bannerId = net.bannerId||""; S.adConfig.interstitialId = net.interstitialId||""; S.adConfig.rewardedId = net.rewardedId||"";
  S.adConfig.activeNetworkUsed = used;
}
function saveAllAdSettings(){
  const admob = {bannerId:$("#ad_admob_banner").value.trim(), interstitialId:$("#ad_admob_inter").value.trim(), rewardedId:$("#ad_admob_rew").value.trim()};
  const unity = {gameId:$("#ad_unity_gameid").value.trim(), bannerId:$("#ad_unity_banner").value.trim(), interstitialId:$("#ad_unity_inter").value.trim(), rewardedId:$("#ad_unity_rew").value.trim()};
  const applovin = {bannerId:$("#ad_applovin_banner").value.trim(), interstitialId:$("#ad_applovin_inter").value.trim(), rewardedId:$("#ad_applovin_rew").value.trim()};
  const re = /^[a-zA-Z0-9]{16}$/, bad = [["Banner",applovin.bannerId],["Interstitial",applovin.interstitialId],["Rewarded",applovin.rewardedId]].filter(([,v])=>v && !re.test(v));
  if(bad.length) return alert("AppLovin "+bad.map(([n])=>n).join(", ")+" ID galat hai — AppLovin MAX Dashboard ka Ad Unit ID 16-character alphanumeric code hota hai (sirf a-z, A-Z, 0-9)");
  if(unity.gameId && !/^\d{6,7}$/.test(unity.gameId)) return alert("Unity Game ID galat hai — yeh 6-7 digit ka number hona chahiye");
  if(!S.adConfig.networks) S.adConfig.networks = {};
  S.adConfig.networks.admob = admob; S.adConfig.networks.unity = unity; S.adConfig.networks.applovin = applovin;
  S.adConfig.network = $("#adNetworkSel").value;
  syncActiveAdIds();
  save(); alert("Saari Monetization Settings save ho gayi! Active mode: "+$("#adNetworkSel").selectedOptions[0].textContent); me();
}

  const i = S.config.payoutProviders.indexOf(val);
  if(i===-1) S.config.payoutProviders.push(val); else S.config.payoutProviders.splice(i,1);
  save(); me();
}

function saveStreakRewards(){
  const arr = [];
  for(let i=0;i<(S.config.streakRewards||[]).length;i++){
    const raw = $("#str_"+i).value.trim();
    const num = parseFloat(raw);
    arr.push(raw.startsWith("$") ? raw : (isNaN(num)?raw:num));
  }
  S.config.streakRewards = arr; save(); alert("Streak rewards save ho gaye"); me();
}
function addPromo(){
  const c = $("#pcCode").value.trim(), v = parseInt($("#pcRp").value,10);
  if(!/^\d{6}$/.test(c)) return alert("6 digit code daalo");
  if(isNaN(v) || v<=0) return alert("RP value daalo");
  if(!S.promos) S.promos = {};
  S.promos[c] = v; save(); me();
}
function delPromo(c){ delete S.promos[c]; save(); me(); }
function addMatch(){
  const g = $("#ag").value.trim().toLowerCase(), p = parseInt($("#ap2").value,10), m = parseInt($("#am").value,10)||60;
  if(!["arctic","hoop"].includes(g) || isNaN(p)) return alert("Game mein 'arctic' ya 'hoop' likho aur pool bharo");
  S.tours.push({id:now(),g,name:g==="hoop"?"Hoop Challenge":"Arctic Voyage",split:"Top 50",pool:p,end:now()+m*MIN}); save(); alert("Tournament add ho gaya"); me();
}
function wdFraudFlag(w){
  // Single-device demo app, so this only checks within this device's own request history.
  // A real fraud check (duplicate UPI/PayPal across accounts, fake-coin detection) needs a backend.
  const sameId = S.wd.filter(x=>x.to===w.to && x.id!==w.id).length;
  return sameId>0 ? `⚠️ Yeh UPI/PayPal ID ${sameId} aur request(s) mein bhi use hui hai — manually review karo` : "";
}
function wdRow(w){
  const flag = w.status==="PENDING" ? wdFraudFlag(w) : "";
  const inr = usd => Math.round(parseFloat(usd)*cfg().usdToInr).toLocaleString("en-IN");
  const amtLine = !isFeeMethod(w.method)
    ? `₹${inr(w.net)} net (req ₹${inr(w.requested)}, TDS ₹${inr(w.tds)})`
    : `${w.method==="Binance"?"USDT ":"$"}${w.net} net (req ${w.method==="Binance"?"USDT ":"$"}${w.requested}, TDS N/A)`;
  const backendOn = !!cfg().payoutWebhookUrl;
  const backendBadge = backendOn ? (
    w.backendSent===true ? `<br><span style="color:#22c55e;font-size:11px">📤 Backend: Sent (${w.backendStatus})</span>`
    : w.backendSent===false ? `<br><span style="color:#ff5c5c;font-size:11px">📤 Backend: Failed${w.backendError?" — "+esc(w.backendError):""}</span>`
    : `<br><span class="mut" style="font-size:11px">📤 Backend: Not sent</span>`
  ) : "";
  return `<div class="lb" style="flex-wrap:wrap">
    <span class="n">${esc(w.user_id)} • ${amtLine} • ${esc(w.method)}<br>
    <span class="mut">${esc(w.to)}</span>${w.mobile?`<br><span class="mut">📱 ${esc(w.mobile)}</span>`:""}${w.utr?`<br><span class="mut">UTR: ${esc(w.utr)}</span>`:""}${flag?`<br><span style="color:#ffb020;font-size:11px">${flag}</span>`:""}${backendBadge}</span>
    <span class="mut">${w.status}${w.status==="PENDING"&&cfg().payoutAutoMode&&(cfg().payoutProviders||[]).length>0?` <span style="color:#22c55e">⚡ Auto</span>`:""}</span>
    ${w.status==="PENDING"?`<button class="btn g sm" onclick="approveWd('${w.id}')">✓ Approve</button><button class="btn sm" onclick="rejectWd('${w.id}')">✗ Reject</button>`:""}
    ${backendOn&&(w.status==="PENDING"||w.status==="APPROVED")?`<button class="btn s sm" onclick="sendWdToBackend(S.wd.find(x=>x.id==='${w.id}'))">📤 ${w.backendSent===undefined?"Send":"Resend"} to Backend</button>`:""}
    ${w.status==="APPROVED"?`<div style="width:100%;display:flex;gap:6px;margin-top:6px"><input id="utr_${w.id}" placeholder="12-digit UTR number" style="margin-bottom:0;flex:1"><button class="btn g sm" onclick="markPaid('${w.id}')">Mark as Paid</button></div>`:""}
  </div>`;
}
function approveWd(id){ const w=S.wd.find(x=>x.id===id); if(!w) return; w.status="APPROVED"; save(); me(); }
function rejectWd(id){ const w=S.wd.find(x=>x.id===id); if(!w) return; S.coins=(S.coins||0)+w.coins; w.status="REJECTED"; save(); me(); }
function markPaid(id){
  const w=S.wd.find(x=>x.id===id); if(!w) return;
  const inp = $("#utr_"+id), utr = inp?inp.value.trim():"";
  if(!/^\d{10,16}$/.test(utr)) return alert("Valid UTR number daalo (10-16 digit)");
  w.status="SUCCESS"; w.utr=utr;
  S.wdNotify = `$${w.net} sent successfully! UTR: ${utr}`;
  save(); me();
}
async function saveCsv(filename, csv){
  try{
    const downloads = window.claude ? await window.claude.use("downloads") : null;
    if(!downloads){ alert("Download yahan available nahi hai is view mein"); return; }
    await downloads.save({filename, data: csv});
  }catch(e){
    if(e && e.code === "declined") return; // user cancelled, no error needed
    alert("Download fail ho gaya: " + (e && e.message ? e.message : "unknown error"));
  }
}
async function exportUpiTdsCsv(){
  const d = new Date(), ym = d.toISOString().slice(0,7), rate = cfg().usdToInr, tdsPct = cfg().upiTdsPct;
  const rows = S.wd.filter(w=>w.method==="UPI" && w.status==="SUCCESS" && new Date(w.created).toISOString().slice(0,7)===ym);
  if(!rows.length){ alert("Is mahine koi UPI SUCCESS payout nahi hai"); return; }
  let totalReq=0, totalTds=0, totalNet=0;
  let csv = "ID,User,UPI ID,Mobile,Requested(₹),TDS %,TDS(₹),Net Payout(₹),UTR,Date\n";
  rows.forEach(w=>{
    const req = Math.round(parseFloat(w.requested)*rate), tds = Math.round(parseFloat(w.tds)*rate), net = Math.round(parseFloat(w.net)*rate);
    totalReq+=req; totalTds+=tds; totalNet+=net;
    csv += `${w.id},${w.user_id},${w.to},${w.mobile||""},${req},${tdsPct}%,${tds},${net},${w.utr},${new Date(w.created).toLocaleDateString()}\n`;
  });
  csv += `\nTOTAL,,,,${totalReq},,${totalTds},${totalNet},,\n`;
  csv += `\nMonth: ${ym}\nTotal UPI SUCCESS Payouts: ${rows.length}\nTotal TDS (${tdsPct}%) payable to Govt: ₹${totalTds} — Challan 281 bharne ke liye\n`;
  await saveCsv(`UPI_TDS_Report_${ym}.csv`, csv);
}
