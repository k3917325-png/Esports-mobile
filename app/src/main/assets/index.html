<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<title>Esports Reward App</title>
<style>
:root{--bg:#ece6fa;--card:#fff;--text:#2a1560;--muted:#7b6c9f;--acc:#6d2fe0;--gold:#f5a300;--ok:#1fa971;--in:rgba(109,47,224,.09);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160c2e;--card:#26154a;--text:#f3ecff;--muted:#b3a3d6}}
:root[data-theme="dark"]{--bg:#160c2e;--card:#26154a;--text:#f3ecff;--muted:#b3a3d6}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.logo{font-weight:800;font-size:19px}.logo span{color:var(--acc)}
.bal{background:var(--card);color:var(--gold);padding:7px 13px;border-radius:20px;font-weight:700;font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;background:var(--acc);color:#fff;width:100%}
.btn.g{background:var(--ok);color:#04281a}.btn.s{background:var(--in);color:var(--text)}.btn:disabled{opacity:.45}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
input{width:100%;padding:12px;border-radius:10px;border:2px solid transparent;background:var(--in);color:var(--text);font-size:15px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--acc)}
h3{margin:4px 0 10px;font-size:15px}.mut{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid rgba(180,140,255,.18);background:var(--card);color:var(--muted);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s}
.chip.on{background:linear-gradient(135deg,#a970ff,#6d2fe0);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(109,47,224,.45);transform:scale(1.05)}
.slider{display:flex;overflow-x:auto;gap:10px;scroll-snap-type:x mandatory;margin-bottom:12px}
.slide{flex:0 0 88%;scroll-snap-align:start;border-radius:14px;padding:18px;color:#fff;font-weight:700;min-height:84px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:linear-gradient(160deg,#241542,#120a28);border:1px solid rgba(180,140,255,.25);border-radius:16px;padding:18px 12px;font-size:14px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 14px rgba(50,20,110,.3)}
.cat .ci{font-size:24px;background:rgba(255,255,255,.08);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lb{display:flex;gap:12px;align-items:center;padding:11px 14px;background:var(--card);border-radius:12px;margin-bottom:8px}
.lb b:first-child{width:26px;color:var(--muted)}.lb:nth-child(-n+4) b:first-child{color:var(--gold)}.lb .n{flex:1;font-weight:600}.lb .p{color:var(--ok);font-weight:700}
.room{background:var(--in);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
nav{display:flex;background:var(--card);padding:6px 0 8px}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;padding:5px;cursor:pointer}nav button.on{color:var(--acc)}nav span{display:block;font-size:19px}
.msg{text-align:center;font-weight:600;font-size:13px;min-height:20px;margin:6px 0}.ok{color:var(--ok)}.err{color:#ff5c5c}
canvas{display:block;margin:0 auto 10px;border-radius:10px;max-width:100%}
.login{max-width:440px;margin:auto;padding:30px 20px;width:100%}
.hero{background:linear-gradient(180deg,#b06bff,#7c3fd6);border-radius:16px;padding:22px 10px;text-align:center;color:#fff;font-weight:800;font-size:26px;line-height:1.1;margin-bottom:12px}.hero b{display:block;color:#ffd54a;font-size:38px}
.tc{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 14px rgba(80,40,160,.18)}
.tb{height:104px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.tm{display:flex;justify-content:space-between;padding:12px 14px 4px;text-align:center}.tm div{flex:1;font-size:11px;color:var(--muted)}.tm b{display:block;font-size:15px;color:var(--text);margin-top:3px}
.play{margin:8px 14px 14px;width:calc(100% - 28px);background:linear-gradient(180deg,#8b4dff,#5a1fc4)}
.adbox{min-height:70px;border:1px dashed var(--muted);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:var(--in);margin-bottom:14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ===== Splash screen ===== */
#splash{position:fixed;inset:0;z-index:2147483100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 90% at 50% 25%,#3b1d8f 0%,#1c1050 45%,#0a0724 100%);color:#fff;transition:opacity .5s ease,visibility .5s;overflow:hidden}
#splash.hide{opacity:0;visibility:hidden}
#splash::before,#splash::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.35;animation:spFloat 6s ease-in-out infinite}
#splash::before{background:#6d2fe0;top:-90px;left:-110px}
#splash::after{background:#1d6fe0;bottom:-100px;right:-110px;animation-delay:-3s}
@keyframes spFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,24px)}}
.sp-logo{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;animation:spPulse 1.8s ease-in-out infinite}
.sp-logo::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,60,.45),rgba(255,200,60,0) 70%);animation:spGlow 1.8s ease-in-out infinite}
.sp-logo svg{position:relative;width:132px;height:132px;filter:drop-shadow(0 6px 18px rgba(255,170,0,.55))}
.sp-shine{animation:spShine 2.2s ease-in-out infinite}
@keyframes spPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spGlow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spShine{0%{transform:translateX(-90px)}60%,100%{transform:translateX(150px)}}
.sp-title{font-size:34px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;font-family:'Segoe UI',Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#fff7c2,#ffc83a 55%,#f08a00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(90,40,0,.6))}
.sp-title span{display:block;text-align:center;font-size:15px;letter-spacing:7px;margin-top:2px;background:linear-gradient(90deg,#c9a7ff,#7fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-bar{width:min(240px,66vw);height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.sp-bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#8b4dff,#4da3ff,#ffd54a);animation:spLoad 2.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes spLoad{0%{width:0}60%{width:72%}100%{width:100%}}
.sp-load{font-size:12px;letter-spacing:2px;color:#b3a3d6;animation:spBlink 1.2s ease-in-out infinite;font-family:'Segoe UI',Roboto,Arial,sans-serif}
@keyframes spBlink{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *,#splash::before,#splash::after{animation-duration:0s!important}.sp-bar i{width:100%}}

/* ===== Hidden Admin View ===== */
#adm{display:none;position:fixed;inset:0;z-index:2147483200;background:var(--bg);color:var(--text);overflow:hidden}
#adm .aw{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 12px 0;position:relative}
#adm .atop{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-size:17px}
#adm .atabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;flex:0 0 auto}
#adm .ch{white-space:nowrap;border:1px solid rgba(180,140,255,.25);background:var(--card);color:var(--muted);padding:8px 12px;border-radius:18px;font-size:13px;font-weight:700;cursor:pointer}
#adm .ch.on{background:var(--acc);color:#fff;border-color:transparent}
#adm .chips2{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
#adm .abody{flex:1;overflow-y:auto;padding-bottom:96px}
#adm .asave{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid rgba(180,140,255,.25)}
#adm h3{margin:14px 0 8px;font-size:15px}
#adm .ar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
#adm .ar input,#adm .ar select{margin:0;width:auto;flex:0 1 150px;min-width:70px}
#adm .ar input[type=time],#adm .ar input[type=month]{flex:0 0 auto}
#adm select,#adm textarea{background:var(--in);color:var(--text);border:2px solid transparent;border-radius:10px;padding:10px;font-size:14px;max-width:100%}
#adm textarea{width:100%;min-height:70px;margin-bottom:8px;font-family:inherit}
#adm .b{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none;display:inline-block;text-align:center}
#adm .b.g{background:var(--ok);color:#04281a}#adm .b.bad{background:#e5484d;color:#fff}#adm .b.s{background:var(--in);color:var(--text)}
#adm .b.sm{padding:8px 12px;font-size:13px}#adm .b.wf{width:100%;margin:2px 0 8px}#adm .b:disabled{opacity:.45}
#adm .card2{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
#adm .lb2{background:var(--card);border-radius:12px;padding:10px 12px}
#adm .sum{background:var(--in);border-radius:10px;padding:10px;margin-top:8px}
#adm .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
#adm .k{color:var(--muted);font-size:12px}#adm .v{font-weight:700;word-break:break-all}
#adm .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
#adm .b-Pending{background:#f5a30030;color:#f5a300}#adm .b-Paid{background:#1fa97130;color:#1fa971}#adm .b-Rejected{background:#e5484d30;color:#e5484d}
#adm .amod{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:5;padding:20px}
#adm .abox{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:380px}
</style>

(function(){

async function cloudCall(method, path, body, token){

      body: body ? JSON.stringify(body) : undefined });

}

function reconcileTours(){
  if(!(S && S.tours)) return;
  let fixed = false;
  const enabled = cfg().gamesEnabled||{};
  // add newly-enabled games that aren't owned yet
  Object.values(GAME_CANON).forEach(c=>{
    if(enabled[c.g]!==false && !S.tours.some(t=>t.id===c.id)){ S.tours.push({...c, pool:(cfg().gamePools&&cfg().gamePools[c.g])||c.pool, end:now()+(cfg().tourDurationMin||30)*MIN}); fixed = true; }
  });
  // remove games the admin turned off
  const before = S.tours.length; S.tours = S.tours.filter(t=>enabled[t.g]!==false); if(S.tours.length!==before) fixed = true;
  // admin changed the tournament duration -> apply it to all active tournaments' timers
  if(S.tourDurApplied !== cfg().tourDurationMin){ S.tours.forEach(t=>{ t.end = now()+(cfg().tourDurationMin||30)*MIN; }); S.tourDurApplied = cfg().tourDurationMin; fixed = true; }
  // admin changed a game's prize pool -> sync it onto the live tournament
  S.tours.forEach(t=>{ const p = cfg().gamePools && cfg().gamePools[t.g]; if(p && !t.manual && t.pool!==p){ t.pool = p; fixed = true; } });
  // admin-created manual tournaments: add new ones, drop the ones admin deleted
  const mts = (cfg().manualTours||[]).filter(m=>m && GAME_CANON[m.g] && enabled[m.g]!==false);
  mts.forEach(m=>{ if(!S.tours.some(t=>t.id===m.id)){ S.tours.push({id:m.id, g:m.g, name:GAME_CANON[m.g].name, split:"Top 50", pool:m.pool, manual:true, end:now()+(m.min||60)*MIN}); fixed = true; } });
  const keep = S.tours.filter(t=>!t.manual || mts.some(m=>m.id===t.id)); if(keep.length!==S.tours.length){ S.tours = keep; fixed = true; }
  if(fixed) save();
}

const LB_TOTAL = 10000000, LB_TOP_N = 100, LB_MAX = 6200, LB_MID = 5500, LB_MIN = 5;
const LB_K2 = Math.log(LB_MID/LB_MIN)/(LB_TOTAL-LB_TOP_N);
function scoreAtRank(i){
  if(i < LB_TOP_N) return Math.round(LB_MAX - i*(LB_MAX-LB_MID)/(LB_TOP_N-1));
  return Math.max(LB_MIN, Math.round(LB_MID*Math.exp(-LB_K2*(i-LB_TOP_N))));
}
function estimateRank(myScore){
  if(myScore >= LB_MAX) return 0;
  if(myScore > LB_MID) return Math.round((LB_MAX-myScore)*(LB_TOP_N-1)/(LB_MAX-LB_MID));
  if(myScore <= LB_MIN) return LB_TOTAL-1;
  return Math.min(LB_TOTAL-1, Math.max(LB_TOP_N, Math.round(LB_TOP_N + Math.log(LB_MID/myScore)/LB_K2)));
}
function lbFmt(n){ return new Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(n); }
function lbPrizeTable(){ return cfg().lbPrizeTable || defaultConfig().lbPrizeTable; }
function genLeaderboardTop(count){
  const list = [];
  for(let i=0;i<count;i++){
    const base = NAMES[i%NAMES.length], name = i<NAMES.length ? base : base+Math.floor(i/NAMES.length+1);
    list.push({name, score: scoreAtRank(i)});
  }
  return list;
}

function bonusInTimeWindow(){
  const c = cfg();
  if(!c.dailyBonusTimeEnabled) return true;
  const d = new Date(), mins = d.getHours()*60 + d.getMinutes();

  const startM = sh*60+sm, endM = eh*60+em;

}

function throwKnife(){
  if(!G || G.over) return;
  const absAngle = G.knifeRot - Math.PI/2; // current angle at the "top" (12 o'clock) point where a thrown knife lands
  const norm = a => { a = a % (Math.PI*2); if(a<0) a += Math.PI*2; return a; };
  const hit = G.stuck.some(s => { let d = Math.abs(norm(s) - norm(absAngle)); d = Math.min(d, Math.PI*2-d); return d < 0.26; });
  if(hit){
    G.over = true; G.knifeHitFx = 18;
    cancelAnimationFrame(G.raf);
    knifeStep(); // render the final frame showing the collision
    setTimeout(()=>{ if(G) gameOver(); }, 900);
    return;
  }
  G.stuck.push(absAngle);
  G.score += 1;
  G.knifeRotSpeed = Math.min(0.09, G.knifeRotSpeed + 0.0028);
  G.knifeThrowFx = 8;
}

function initBlockGrid(){

function blockCluster(r0,c0){
  const rows=G.grid.length, cols=G.grid[0].length, col=G.grid[r0][c0];
  if(col===null) return [];
  const seen = new Set(), stack=[[r0,c0]], out=[];
  while(stack.length){
    const [r,c] = stack.pop(), key=r+","+c;
    if(seen.has(key)||r<0||c<0||r>=rows||c>=cols||G.grid[r][c]!==col) continue;
    seen.add(key); out.push([r,c]);
    stack.push([r-1,c],[r+1,c],[r,c-1],[r,c+1]);
  }
  return out;
}
function blockGravity(){
  const rows=G.grid.length, cols=G.grid[0].length;
  for(let c=0;c<cols;c++){
    let write = rows-1;
    for(let r=rows-1;r>=0;r--){ if(G.grid[r][c]!==null){ G.grid[write][c]=G.grid[r][c]; if(write!==r) G.grid[r][c]=null; write--; } }
    for(let r=write;r>=0;r--) G.grid[r][c] = Math.floor(Math.random()*G.colors.length);
  }
}
function tapBlock(px,py){
  if(!G.grid) return;
  const gx=10, gy=60, cell=50, rows=G.grid.length, cols=G.grid[0].length;
  const col = Math.floor((px-gx)/cell), row = Math.floor((py-gy)/cell);
  if(row<0||col<0||row>=rows||col>=cols) return;
  const cluster = blockCluster(row,col);
  if(cluster.length < 2) return;
  cluster.forEach(([r,c])=>G.grid[r][c]=null);
  G.score += cluster.length*cluster.length*2;
  blockGravity();

// keep generating rows above the screen; every row has >=1 reachable GREEN candle (jump height ~145px, max gap 108px)

function blockmatchStep(){
  const x = G.x;
  if(!G.grid) initBlockGrid();
  G.bmTime -= 1/60; if(G.bmTime<=0){ G.over = true; return gameOver(); }
  x.fillStyle = "#0f2a22"; x.fillRect(0,0,320,480);
  const gx=10, gy=60, cell=50;
  for(let r=0;r<G.grid.length;r++) for(let c=0;c<G.grid[0].length;c++){
    const col = G.grid[r][c]; if(col===null) continue;
    x.fillStyle = G.colors[col];
    const px=gx+c*cell, py=gy+r*cell;
    x.beginPath(); x.roundRect ? x.roundRect(px+2,py+2,cell-4,cell-4,8) : x.rect(px+2,py+2,cell-4,cell-4); x.fill();
  }
  x.fillStyle = "#fff"; x.font = "bold 16px sans-serif"; x.textAlign = "left"; x.fillText(Math.ceil(G.bmTime)+"s",10,24);

function bank(){
  const rawSc = Math.max(0, Math.floor(G.score)||0), id = G.t.id;
  // Anti-cheat: cap the banked score to a plausible max based on real elapsed play time,
  // so a tampered/injected G.score (e.g. via devtools) can't produce an absurd result.
  const elapsedSec = Math.max(0.5, (now() - (G.startMs||now())) / 1000);
  const MAX_RATE = {arctic:9, hoop:7, loop:15, colorbounce:9, bubble:9, drive:15, shooter:16, knife:4, blockmatch:34, dollar:4, candle:30, dollarbox:130};
  const cap = Math.ceil(elapsedSec * (MAX_RATE[G.t.g]||12)) + 25;
  const sc = Math.min(rawSc, cap);
  S.best[id] = Math.max(S.best[id]||0, sc); save();
  G.elapsedSec = elapsedSec; cloudScore(G.t, sc, 1, elapsedSec);
  return sc;
}

let wdSyncBusy = false;
async function syncWdStatuses(){
  if(!SHEETS_URL || !S || !S.wd || wdSyncBusy) return;
  wdSyncBusy = true;
  try{
    await Promise.all(S.wd.filter(w=>!w.sheetSent && !w.refunded && w.status==="PENDING").map(sendWdToSheet));
    const open = S.wd.filter(w=>w.sheetSent===true && (w.status==="PENDING"||w.status==="APPROVED"));
    const byMobile = {};
    open.forEach(w=>{ (byMobile[w.mobile] = byMobile[w.mobile]||[]).push(w); });
    let changed = false;
    for(const m of Object.keys(byMobile)){
      const d = await sheetsCall({action:"status", mobile:m, ids:byMobile[m].map(w=>w.id)});
      if(!d || !d.ok) continue;
      (d.items||[]).forEach(it=>{
        const w = byMobile[m].find(x=>x.id===it.id); if(!w) return;
        const ns = SHEET_STATUS[it.status] || w.status;
        if(ns !== w.status){ w.status = ns; changed = true; }
        if(it.txn && w.utr !== it.txn){ w.utr = it.txn; changed = true; }
        if(ns === "REJECTED" && !w.refunded){ wdRefund(w); changed = true; }
      });
    }
    if(changed){ save(); render(); }
  }catch(e){}
  wdSyncBusy = false;
}

function markDirty(){
  A.dirty = true;
  const s = $adm.querySelector(".asave"); if(s){ s.querySelector(".mut").textContent = "● Unsaved changes"; const b = s.querySelector("button"); b.disabled = false; }
}

/* ---------- events ---------- */
function parseVal(t, v){
  if(t==="n"){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  if(t==="i"){ const n = parseInt(v,10); return isNaN(n) ? 0 : n; }
  if(t==="csv") return String(v).split(",").map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x) && x>=0);
  if(t==="a"){ v = String(v).trim(); return /^\d+(\.\d+)?$/.test(v) ? Number(v) : v; }
  return String(v);
}
function onField(e, final){
  const el = e.target, p = el.dataset && el.dataset.p; if(!p || !A.doc) return;
  sp(A.doc, p, parseVal(el.dataset.t, el.value)); markDirty();
  const pre = p.split(".").slice(0,2).join("."), sumEl = $adm.querySelector(`[data-sumfor="${pre}"]`);
  if(sumEl){ const t = gp(A.doc, pre)||{}; let s = 0; for(let r=1;r<=Number(sumEl.dataset.n);r++) s += Number(t[r])||0; sumEl.textContent = "💜 " + s.toLocaleString() + " RP"; }
  if(final && el.dataset.rr) draw();
}
$adm.addEventListener("input", e=>{
  const d = e.target.dataset || {};
  if(d.a2 === "cq"){ A.cq = e.target.value; const l = $adm.querySelector("#ctryList"); if(l) l.innerHTML = ctryList(); return; }
  if(d.a2 === "uq"){ A.us.q = e.target.value; return; }
  if(e.target.tagName === "SELECT") return;
  onField(e, false);
});
$adm.addEventListener("change", e=>{
  const d = e.target.dataset || {};
  if(d.a2 === "pos"){ const o = A.doc.config.gamesOrder, g = d.g, i = o.indexOf(g); o.splice(i,1); o.splice(parseInt(e.target.value,10),0,g); markDirty(); draw(); return; }
  if(d.a2 === "repMonth"){ A.repMonth = e.target.value; return; }
  onField(e, true);
});
const actions = {
  close(){ closeAdmin(); },
  tab(el){ A.tab = el.dataset.v; draw(); if(A.tab==="users" && !A.us.loaded) loadUsers(); if(A.tab==="wd" && !A.wd.loaded) loadWd(); },
  login(){ const pin = ($adm.querySelector("#admPin")||{}).value || ""; if(!pin) { A.msg = "PIN daalo"; draw(); return; } login(pin); },
  save(){ saveCfg(); },
  unity(){ setUnity(); },
  tg(el){ const p = el.dataset.p, v = gp(A.doc,p), cur = el.dataset.d==="1" ? v!==false : v===true; sp(A.doc,p,!cur); markDirty(); draw(); },
  day(el){ const p = el.dataset.p, i = parseInt(el.dataset.i,10); let a = (gp(A.doc,p)||[]).slice(); a = a.includes(i) ? a.filter(x=>x!==i) : a.concat(i).sort((x,y)=>x-y); sp(A.doc,p,a); markDirty(); draw(); },
  mv(el){ const o = A.doc.config.gamesOrder, g = el.dataset.g, d = parseInt(el.dataset.d,10), i = o.indexOf(g), j = i + d; if(j<0||j>=o.length) return; o.splice(i,1); o.splice(j,0,g); markDirty(); draw(); },
  addcg(){ const n = $adm.querySelector("#ngName").value.trim().slice(0,40), u = $adm.querySelector("#ngUrl").value.trim();
    if(!n || !/^https?:\/\/\S+$/i.test(u)) return flash("Naam aur valid https:// link daalo");
    (A.doc.config.customGames = A.doc.config.customGames||[]).push({id:"g"+Date.now(), name:n, url:u}); markDirty(); draw(); },
  delcg(el){ A.doc.config.customGames.splice(parseInt(el.dataset.i,10),1); markDirty(); draw(); },
  addmt(){ const g = $adm.querySelector("#mtG").value, pool = parseInt($adm.querySelector("#mtPool").value,10), min = parseInt($adm.querySelector("#mtMin").value,10)||60;
    if(!GAME_CANON[g] || isNaN(pool) || pool<1) return flash("Pool (RP) daalo");
    (A.doc.config.manualTours = A.doc.config.manualTours||[]).push({id:Date.now(), g, pool, min:Math.max(1,Math.min(10080,min))}); markDirty(); draw(); },
  delmt(el){ A.doc.config.manualTours.splice(parseInt(el.dataset.i,10),1); markDirty(); draw(); },
  addsp(){ const u = $adm.querySelector("#spUrl").value.trim(), pl = $adm.querySelector("#spPlat").value;
    if(!/^https?:\/\/\S+$/i.test(u)) return flash("Valid https:// link daalo");
    (A.doc.config.supportLinks = A.doc.config.supportLinks||[]).push({id:"s"+Date.now(), platform:pl, url:u}); markDirty(); draw(); },
  delsp(el){ A.doc.config.supportLinks.splice(parseInt(el.dataset.i,10),1); markDirty(); draw(); },
  ctg(el){ const k = el.dataset.k, id = el.dataset.id; let a = (A.doc.config[k]||[]).slice(); a = a.includes(id) ? a.filter(x=>x!==id) : a.concat(id); A.doc.config[k] = a; markDirty();
    const l = $adm.querySelector("#ctryList"), st = l.scrollTop; l.innerHTML = ctryList(); l.scrollTop = st; },
  addpc(){ const c = $adm.querySelector("#pcCode").value.trim(), v = parseInt($adm.querySelector("#pcRp").value,10);
    if(!/^\d{6}$/.test(c) || isNaN(v) || v<1) return flash("6-digit code aur RP daalo");
    A.doc.promos[c] = v; markDirty(); draw(); },
  delpc(el){ delete A.doc.promos[el.dataset.k]; markDirty(); draw(); },
  resetMyRp(){ if(S){ S.rp = 0; save(); flash("Is device ka RP 0 ho gaya"); } else flash("Pehle app mein login karo"); },
  copy(el){ try{ navigator.clipboard.writeText(el.dataset.t); flash("Copied"); }catch(e){ flash("Copy nahi hua"); } },
  wdload(){ loadWd(); },
  wdf(el){ A.wd.filter = el.dataset.v; draw(); },
  wdm(el){ A.wd.method = el.dataset.v; draw(); },
  async paid(el){
    const txn = await ask({title:"Mark Paid", msg:"Paisa bhejne ke baad Transaction ID / UTR daalo", input:true, ph:"UTR / Txn ID", ok:"Mark Paid"});
    if(!txn) return;
    await setStatus(el.dataset.id, el.dataset.m, "Paid", txn);
  },
  async rej(el){
    const ok = await ask({title:"Reject?", msg:`${el.dataset.id} reject karna hai? User ke coins wapas ho jayenge.`, ok:"Reject", bad:true});
    if(ok) await setStatus(el.dataset.id, el.dataset.m, "Rejected", "");
  },
  usearch(){ loadUsers(); },
  async ban(el){
    const ban = el.dataset.b === "1";
    const ok = await ask({title: ban?"Ban karo?":"Unban karo?", msg:`${el.dataset.m} ${ban?"login/withdraw nahi kar payega":"dobara use kar payega"}.`, ok: ban?"Ban":"Unban", bad:ban});
    if(!ok) return;
    try{ const d = await call("adminBan", {mobile:el.dataset.m, banned:ban}); flash(d.ok ? (ban?"Banned 🚫":"Unbanned ✅") : (d.error||"Error")); }catch(e){ if(e.message!=="auth") flash("Network error"); }
    loadUsers();
  },
  async banNum(){
    const n = ($adm.querySelector("#banNum").value||"").replace(/\D/g,""); if(n.length<7) return flash("Valid number daalo");
    try{ const d = await call("adminBan", {mobile:n, banned:true}); flash(d.ok ? "Banned 🚫" : (d.error||"Error")); }catch(e){ if(e.message!=="auth") flash("Network error"); }
    loadUsers();
  },
  async rep(el){
    const m = el.dataset.m, ym = (A.repMonth || new Date().toISOString().slice(0,7));
    flash("Report ban rahi hai...");
    let items;
    try{ const d = await call("adminList", {filter:"Paid", month:ym, method:m}); if(!d.ok) return flash(d.error||"Error"); items = d.items||[]; }catch(e){ if(e.message!=="auth") flash("Network error"); return; }
    const rows = items.filter(w=>w.method===m && w.status==="Paid" && String(w.time).slice(0,7)===ym);
    if(!rows.length) return flash(`${ym} mein koi ${m} Paid payout nahi`);
    const isTds = ["UPI","Paytm","PhonePe"].includes(m), cur = rows[0].currency, c = A.doc.config;
    const pct = isTds ? ({UPI:c.upiTdsPct,Paytm:c.paytmTdsPct,PhonePe:c.phonepeTdsPct})[m] : ({PayPal:c.paypalFeePct,Binance:c.binanceFeePct,Bybit:c.bybitFeePct})[m];
    let tr = 0, tc = 0, tn = 0;
    let csv = `ID,Name,Mobile,Payout ID,Requested(${cur}),${isTds?"TDS":"Fee"}(${cur}),Net Payout(${cur}),UTR,Date\n`;
    rows.forEach(w=>{ const net = parseFloat(w.net)||0, g = parseFloat(w.gross)||net, cut = Math.max(0, g-net); tr+=g; tc+=cut; tn+=net;
      csv += [w.id,w.name,w.mobile,w.to,g.toFixed(2),cut.toFixed(2),net.toFixed(2),w.txn,w.time].map(csvCell).join(",") + "\n"; });
    csv += `\nTOTAL,,,,${tr.toFixed(2)},${tc.toFixed(2)},${tn.toFixed(2)},,\n\nMonth: ${ym}\nTotal ${m} Paid Payouts: ${rows.length}\n`;
    csv += isTds ? `Total TDS (${pct}% current setting) payable to Govt: ${cur} ${tc.toFixed(2)} — Challan 281 bharne ke liye\n` : `Total Processing Fee collected (${pct}% current setting): ${cur} ${tc.toFixed(2)} (TDS yahan nahi lagta)\n`;
    saveCsvFile(`${m}_${isTds?"TDS":"Fee"}_Report_${ym}.csv`, csv); flash("CSV save ho rahi hai");
  }
};
async function setStatus(id, mobile, status, txn){
  try{
    const d = await call("adminSet", {id, mobile, status, txn});
    if(d.ok){ flash(`${id} → ${status} ✅`); await loadWd(true); }
    else flash(d.error || "Error");
  }catch(e){ if(e.message!=="auth") flash("Network error"); }
  draw();
}
$adm.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el || !$adm.contains(el)) return;
  const f = actions[el.dataset.a]; if(f){ if(el.tagName==="A") return f(el); e.preventDefault(); f(el); }
});
$adm.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="admPin") actions.login(); });
})();

</script>
</body>
</html>
