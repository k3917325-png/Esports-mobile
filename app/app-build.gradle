plugins {
    id 'com.android.application'
}

// Ad networks, priority: Unity Ads -> Start.io. IDs are public identifiers, not secrets.
def startioAppId = System.getenv("STARTIO_APP_ID") ?: "209272738"
def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")   // auto-increments every CI build (Play rejects duplicates)
def unityGameId = System.getenv("UNITY_GAME_ID") ?: "800411184"

android {
    namespace "com.mobile.esports"
    compileSdk 36

    defaultConfig {
        applicationId "com.sportsreward.app"   // Play Store package name (code package/namespace stays com.mobile.esports)
        minSdk 24
        targetSdk 36
        versionCode runNumber
        versionName "1.0.0"
        resValue "string", "startio_app_id", startioAppId
        resValue "string", "unity_game_id", unityGameId
        resValue "bool", "unity_test_mode", (System.getenv("UNITY_TEST_MODE") ?: "true")
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // R8: shrink + obfuscate Java code
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.unity3d.ads:unity-ads:4.12.5'
    implementation 'com.startapp:inapp-sdk:5.+'   // Start.io (fallback network)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'   // Google Sign-In
}
