plugins {
    id 'com.android.application'
}

// Ad networks, priority: Unity LevelPlay -> Start.io. IDs are public identifiers, not secrets.
def startioAppId = System.getenv("STARTIO_APP_ID") ?: "209272738"
def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")   // auto-increments every CI build (Play rejects duplicates)
def lpAppKey = System.getenv("LEVELPLAY_APP_KEY") ?: ""
def lpRewarded = System.getenv("LEVELPLAY_REWARDED_ID") ?: ""
def lpBanner = System.getenv("LEVELPLAY_BANNER_ID") ?: ""

android {
    namespace "com.mobile.esports"
    compileSdk 36

    defaultConfig {
        applicationId "com.sportsreward.app"   // Play Store package name (code package/namespace stays com.mobile.esports)
        minSdk 24
        targetSdk 36
        versionCode runNumber
        versionName "1.0.0"
        resValue "string", "startio_app_id", startioAppId
        resValue "string", "levelplay_app_key", lpAppKey
        resValue "string", "levelplay_rewarded_id", lpRewarded
        resValue "string", "levelplay_banner_id", lpBanner
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // R8: shrink + obfuscate Java code
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.5.0'      // Unity LevelPlay
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.15.0'  // Unity Ads network inside LevelPlay (bundles Unity Ads SDK)
    implementation 'com.google.android.gms:play-services-appset:16.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.1.0'
    implementation 'com.startapp:inapp-sdk:5.+'   // Start.io (fallback network)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'   // Google Sign-In
}
