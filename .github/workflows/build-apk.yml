name: Build APK (install-ready)

# Phone se: GitHub app/website -> Actions -> "Build APK" -> Run workflow, ya apk-build branch par push.
# Koi secret nahi chahiye. Debug-signed APK banta hai jo seedha phone me install ho jata hai
# (Google ke TEST AdMob ids ke saath). Play Store ke liye build-aab.yml (signed release) use karo.
on:
  workflow_dispatch:
  push:
    branches: [ apk-build ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses (SDK runner me pehle se hai)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Build debug APK
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          STARTIO_APP_ID: ${{ vars.STARTIO_APP_ID }}
          UNITY_GAME_ID: ${{ vars.UNITY_GAME_ID }}
          UNITY_TEST_MODE: ${{ vars.UNITY_TEST_MODE }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            MSG=$(grep -E "error:|What went wrong|Could not|symbol:|location:|Execution failed|> " build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::$MSG"
          fi
          exit $rc
      - name: Check release build (R8/minify) compiles
        run: |
          set +e
          ./gradlew :app:bundleRelease --no-daemon 2>&1 | tee rel.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            MSG=$(grep -E "error:|What went wrong|Could not|Missing class|R8|Execution failed" rel.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Release build errors::$MSG"
          fi
          exit $rc
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EsportsReward-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
