name: Build APK (install-ready)

# Phone se: GitHub app/website -> Actions -> "Build APK" -> Run workflow, ya apk-build branch par push.
# Koi secret nahi chahiye. Debug-signed APK banta hai jo seedha phone me install ho jata hai
# (Google ke TEST AdMob ids ke saath). Play Store ke liye build-aab.yml (signed release) use karo.
on:
  workflow_dispatch:
  push:
    branches: [ apk-build ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EsportsReward-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
