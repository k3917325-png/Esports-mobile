name: Build Play Store AAB (signed)

# Phone se: secrets daalne ke baad Actions -> "Build Play Store AAB (signed)" run kholo -> Re-run all jobs.
# Output: artifact "play-store-aab" (app-release.aab) + "mapping" (R8 mapping, Play Console me upload karo).
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Variables (optional): UNITY_GAME_ID, STARTIO_APP_ID (Start.io App ID; admin panel se bhi set ho sakta hai)
on:
  push:
    branches: [ aab-build ]   # is branch par push hote hi AAB banta hai (workflow_dispatch tab tak nahi dikhta jab tak file main branch me na ho)
  workflow_dispatch:
    inputs:
      allow_test_ads:
        description: "Google TEST ad IDs ke saath bana do (sirf Play Internal testing ke liye; production se pehle real IDs lagao)"
        type: boolean
        default: false

jobs:
  aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release APK ko GitHub Release me daalne ke liye (direct download link)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check secrets and ad ids
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ALLOW_TEST: ${{ github.event.inputs.allow_test_ads || 'false' }}
        run: |
          miss=""
          [ -z "$KSP" ] && miss="$miss RELEASE_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && miss="$miss RELEASE_KEY_ALIAS"
          [ -z "$KP" ] && miss="$miss RELEASE_KEY_PASSWORD"
          if [ -n "$miss" ]; then echo "::error title=Secrets missing::GitHub Secrets banao:$miss"; exit 1; fi
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Decrypt keystore
        env:
          KSP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in upload-key.enc -out "$RUNNER_TEMP/release.jks" -pass env:KSP 2>/dev/null \
            || { echo "::error title=Password galat::RELEASE_KEYSTORE_PASSWORD galat hai. GITHUB-SECRETS-paste-karo.txt me jo Value likhi hai wahi daalo (copy-paste, koi space nahi)."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KSP" >/dev/null 2>&1 \
            || { echo "::error title=Keystore khul nahi raha::password galat hai."; exit 1; }
      - name: Build release AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          UNITY_GAME_ID: ${{ vars.UNITY_GAME_ID || '800411184' }}
          STARTIO_APP_ID: ${{ vars.STARTIO_APP_ID || '209272738' }}
          UNITY_TEST_MODE: ${{ vars.UNITY_TEST_MODE || 'false' }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean :app:bundleRelease :app:assembleRelease --no-daemon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            MSG=$(grep -E "error:|What went wrong|Could not|symbol:|location:|Execution failed|Missing class|R8" build.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::$MSG"
          fi
          exit $rc
      - name: Verify package name + provider authorities (merged manifest)
        run: |
          M=$(find app/build/intermediates -path "*merged_manifests/release*" -name AndroidManifest.xml | head -1)
          echo "manifest: $M"
          PKG=$(grep -o 'package="[^"]*"' "$M" | head -1)
          echo "$PKG"
          AUTH=$(grep -o 'android:authorities="[^"]*"' "$M" | sort -u)
          echo "$AUTH"
          echo "$PKG" | grep -q 'package="com.sportsreward.app"' || { echo "::error title=Package galat::$PKG"; exit 1; }
          BAD=$(echo "$AUTH" | grep -v 'authorities="com.sportsreward.app\.' || true)
          [ -z "$BAD" ] || { echo "::error title=Authority prefix galat::$BAD"; exit 1; }
          echo "::notice title=Package/authorities OK::$(echo $PKG) | $(echo $AUTH | tr '\n' ' ')"
          CNT=$(grep -c 'androidx.startup.InitializationProvider' "$M")
          echo "provider entries: $CNT"
      - name: Verify AAB is signed with the upload key
        run: |
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA1|SHA256" | head -4
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Verify release APK signature
        run: keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner|SHA1|SHA256" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish APK as GitHub Release (direct download link, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk EsportsReward.apk
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" EsportsReward.apk --title "Esports Reward APK ($TAG)" --notes "Signed release APK (com.sportsreward.app). Install: download -> allow unknown sources -> install." --prerelease
          echo "::notice title=APK link::https://github.com/${{ github.repository }}/releases/download/$TAG/EsportsReward.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
